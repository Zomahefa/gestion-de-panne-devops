events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  server {
    listen 80;
    server_name localhost;
    # Définir les services actifs en dur
    set $active_frontend "frontend-blue";
    set $active_backend  "backend-blue";
    # Résolution DNS Docker
    resolver 127.0.0.11 ipv6=off;
    # Frontend React
    location / {
      proxy_pass http://$active_frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
      proxy_intercept_errors on;
      error_page 404 = /index.html;
    }
    # Django API
    location ~ ^/api(/|$) {
      proxy_pass http://$active_backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }

    # Fichiers statiques Django
    location /django-static/ {
      alias /back/staticfiles/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public";
      add_header Content-Type text/css;
    }

    # Fichiers media Django (images des pannes)
    location /media/ {
      alias /back/media/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public";
    }
    # Grafana
    location ~ ^/grafana(/|$) {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }

    # Prometheus
    location ~ ^/prometheus(/|$) {
      proxy_pass http://prometheus:9090;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }
    location = /metrics/ {
      proxy_pass http://$active_backend:8000;
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }
    location = /mysql-metrics/ {
      proxy_pass http://mysql-exporter:9104/metrics;
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }
  }
}

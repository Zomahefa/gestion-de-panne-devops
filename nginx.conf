events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # 🔄 UPSTREAMS DYNAMIQUES - Blue/Green deployment
  upstream frontend {
    include /etc/nginx/conf.d/frontend_active.conf;  # 📁 Fichier généré dynamiquement
  }
  upstream backend {
    include /etc/nginx/conf.d/backend_active.conf;   # 📁 Fichier généré dynamiquement
  }

  # 🔒 REDIRECTION HTTP → HTTPS
  server {
    listen 80;
    server_name signaler-panne-305.duckdns.org;
    return 301 https://$host$request_uri;  # 🔄 Redirection permanente
  }

  # 🚀 SERVEUR PRINCIPAL HTTPS
  server {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    listen 443 ssl;
    server_name signaler-panne-305.duckdns.org;

    # 🔐 CERTIFICATS SSL
    ssl_certificate /etc/letsencrypt/live/signaler-panne-305.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signaler-panne-305.duckdns.org/privkey.pem;

    resolver 127.0.0.11 ipv6=off;  # 🔄 Résolution DNS interne Docker

    # 🎯 FRONTEND (React)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
      proxy_intercept_errors on;
      error_page 404 = /index.html;  # 🔄 SPA routing
    }

    # 🎯 BACKEND API (Django)
    location ~ ^/api(/|$) {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }

    # 📁 FICHIERS STATIQUES DJANGO
    location /django-static/ {
      alias /back/staticfiles/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public";
    }

    location /media/ {
      alias /back/media/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public";
    }

    # 🔐 GRAFANA - ACCÈS SÉCURISÉ
    location ~ ^/grafana(/|$) {
      # 🛡️ DOUBLE PROTECTION: Auth + Restriction IP
      auth_basic "Accès Monitoring Réservé";
      auth_basic_user_file /etc/nginx/secure/.htpasswd;  # ✅ CHEMOD CORRIGÉ  
      allow 129.222.109.178;    # VOTRE IP
      deny all;            
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }

    # 🔐 PROMETHEUS - ACCÈS SÉCURISÉ
    location ~ ^/prometheus(/|$) {
      # 🛡️ DOUBLE PROTECTION: Auth + Restriction IP
      auth_basic "Accès Monitoring Réservé";
      auth_basic_user_file /etc/nginx/secure/.htpasswd;  # ✅ CHEMOD CORRIGÉ
      
      allow 129.222.109.178;    # VOTRE IP
      deny all;             # ❌ Bloquer toutes les autres IPs
      
      proxy_pass http://prometheus:9090/prometheus;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }

    # 📊 MÉTRIQUES BACKEND (Django) - Via Nginx pour blue/green
    location = /metrics/ {
      proxy_pass http://backend;
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_redirect off;
    }

    # 🗑️ SUPPRIMÉ: Plus besoin de /mysql-metrics/ → scraping direct maintenant
  }
}
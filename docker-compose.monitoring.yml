services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus-monitoring
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=https://signaler-panne-305.duckdns.org/prometheus/'  # URL publique
      - '--web.route-prefix=/prometheus'  #  Préfixe pour le routing Nginx
      - '--web.enable-lifecycle'  # Permet de recharger la config sans redémarrer
    depends_on:
      - mysql-exporter
    networks:
      - panne-jirama-blue
      - panne-jirama-green 
  grafana:
    image: grafana/grafana
    container_name: grafana-monitoring
    ports:
      - "3000:3000"  #  ACCÈS DIRECT: Permet l'accès via IP:3000 si Nginx est down
    environment:
      - GF_SERVER_ROOT_URL=https://signaler-panne-305.duckdns.org/grafana/  #  URL publique
      - GF_SERVER_SERVE_FROM_SUB_PATH=true  #  Support des sous-chemins
      - GF_SECURITY_ADMIN_PASSWORD=Admin123!  #  NOUVEAU: Mot de passe admin
      - GF_USERS_ALLOW_SIGN_UP=false  #  Désactive l'inscription publique
      - GF_AUTH_ANONYMOUS_ENABLED=false  #  Désactive l'accès anonyme
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - panne-jirama-blue
      - panne-jirama-green 
  loki:
    image: grafana/loki:2.9.4
    container_name: loki-monitoring
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - panne-jirama-blue
      - panne-jirama-green 
  promtail:
    image: grafana/promtail:3.5.8
    container_name: promtail-monitoring
    volumes:
      - /var/lib/docker/vfs/containers:/var/lib/docker/vfs/containers:ro
      - /var/log:/var/log:ro  # Lecture seule des logs système
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - panne-jirama-blue
      - panne-jirama-green 
  mysql-exporter:
    image: prom/mysqld-exporter
    container_name: mysql-exporter-monitoring
    restart: always
    command:
      - '--config.my-cnf=/etc/my-exporter.cnf'
    volumes:
      - ./my-exporter.cnf:/etc/my-exporter.cnf:ro
    networks:
      - panne-jirama-blue
      - panne-jirama-green 
  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter-monitoring
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|host|etc|dev|tmp|var/lib/docker/.+)($|/)"'
    networks:
      - panne-jirama-blue
      - panne-jirama-green
volumes:
  grafana_data: 
    external: true
    name: panne-2025_grafana_data
networks:
  panne-jirama-blue:
    external: true
    name: panne-jirama-blue  
  panne-jirama-green:
    external: true
    name: panne-jirama-green
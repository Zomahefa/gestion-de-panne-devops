# ===========================
# 🌐 Fichier Nginx - default.conf
# ===========================

server {
  # Écoute sur le port 80 (HTTP)
  listen 80;
  server_name localhost;

  # ==========================================
  # 🟡 FRONTEND REACT
  # ==========================================
  # Sert les fichiers statiques React qui sont dans /usr/share/nginx/html
  # Ce dossier est rempli lors du build (Dockerfile React prod)
  location / {
    root /usr/share/nginx/html;
    index index.html;

    # try_files = si le fichier n'existe pas, on renvoie toujours index.html
    # Très important pour les applications React (SPA)
    try_files $uri /index.html;
  }

  # ==========================================
  # 🟢 BACKEND DJANGO - API
  # ==========================================
  # Tout ce qui commence par /api est redirigé vers le conteneur backend Django
  location /api/ {
    proxy_pass http://backend:8000/;

    # Transmission correcte des en-têtes originaux
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ==========================================
  # 📁 FICHIERS STATIQUES DJANGO
  # ==========================================
  # Collectés avec `python manage.py collectstatic` en prod
  location /static/ {
    alias /back/static/;
  }

  # ==========================================
  # 🖼️ FICHIERS UPLOADÉS (media)
  # ==========================================
  # Permet d'accéder aux images uploadées par les utilisateurs
  location /media/ {
    alias /back/media/;
  }
}

name: CD blue/green
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]           
jobs:
  Deploy:
    name: Déploiement blue/green 
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5
    - name: Préparer agent SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
    - name: Synchroniser fichiers de configuration
      run: |
        # Synchronisation uniquement des fichiers de configuration nécessaires
        rsync -avz --delete \
          --include='docker-compose.*.yml' \
          --include='nginx.conf' \
          --include='monitoring/' \
          --include='monitoring/**' \
          --exclude='.env.global' \
          --exclude='.my.cnf' \
          --exclude='active_color.txt' \
          --exclude='*' \
          -e "ssh -o StrictHostKeyChecking=no" \
          $GITHUB_WORKSPACE/ \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_DIR }}
    - name: Vérifier fichiers copiés
      run: ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls -l ${{ secrets.VPS_PROJECT_DIR }}"
    
    - name: Déployer couleur inactive, tester, basculer
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
        set -e
        cd ${{ secrets.VPS_PROJECT_DIR }}
        
        # --- Définition des variables ---
        ACTIVE_COLOR=$(cat active_color.txt 2>/dev/null || echo "blue")
        
        if [ "$ACTIVE_COLOR" = "blue" ]; then
          TARGET_COLOR="green"
          TARGET_COMPOSE="docker-compose.green.yml"
          INACTIVE_FE="frontendGreen"
          INACTIVE_BE="backendGreen"
          PREVIOUS_FE="frontendBlue"
          PREVIOUS_BE="backendBlue"
        else
          TARGET_COLOR="blue"
          TARGET_COMPOSE="docker-compose.blue.yml"
          INACTIVE_FE="frontendBlue"
          INACTIVE_BE="backendBlue"
          PREVIOUS_FE="frontendGreen"
          PREVIOUS_BE="backendGreen"
        fi
        
        echo "Couleur active: $ACTIVE_COLOR ; Inactive à déployer: $TARGET_COLOR"
        
        # --- Démarrage des services statiques ---
        docker compose -f docker-compose.db.yml --env-file .env.global up -d --no-recreate
        docker compose -f docker-compose.monitoring.yml up -d --no-recreate
        
        # --- Déploiement de la nouvelle couleur ---
        docker compose -f $TARGET_COMPOSE --env-file .env.global pull
        docker compose -f $TARGET_COMPOSE --env-file .env.global up -d --wait
        docker compose -f docker-compose.edge.yml up -d --no-recreate
        
        # --- TESTS DE SANTÉ AVEC DOCKER EXEC ---
        echo "Tests santé avec docker exec..."

        # Installation curl dans edge
        docker exec edge sh -c "apk add --no-cache curl >/dev/null 2>&1 || true"


        echo "Vérification API /api/status..."
        docker exec $INACTIVE_BE curl --max-time 5 -s http://localhost:8000/api/status/ | grep -q '"status":"ok"' || { echo "API KO"; exit 1; }
        echo "API OK"

        echo "Vérification API métier /api/todos/..."
        docker exec $INACTIVE_BE curl --max-time 5 -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/todos/ | grep -q "200" || { echo "API Todos KO"; exit 1; }
        echo "API Todos OK"

        echo "Vérification frontend page d'accueil..."
        docker exec $INACTIVE_FE curl --max-time 5 -s http://localhost/ | grep -q '<div id="root">' || { echo "❌ Frontend KO"; exit 1; }
        echo "Frontend OK"

        # --- Bascule: modification de Nginx CORRIGÉE ---
        sed -i 's|set[[:space:]]\+\$active_frontend[[:space:]]\+".*"|set $active_frontend "'"$INACTIVE_FE"'"|' nginx.conf
        sed -i 's|set[[:space:]]\+\$active_backend[[:space:]]\+".*"|set $active_backend "'"$INACTIVE_BE"'"|' nginx.conf
        
        # --- Rechargement Nginx ---
        docker exec edge nginx -t
        docker exec edge nginx -s reload
        
        echo "$TARGET_COLOR" > active_color.txt
        
        # --- Vérification post-bascule ---
        MAX_RETRIES=6
        RETRY_COUNT=0
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          echo "Vérification disponibilité publique tentative $((RETRY_COUNT+1))..."
          if curl --max-time 5 -sSf -I https://signaler-panne-305.duckdns.org | grep -q '200'; then
            echo "Site accessible publiquement"
            break
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1 ))
          sleep 5
        done
        
        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
          echo "Bascule échouée, rollback en cours..."
          sed -i 's|set[[:space:]]\+\$active_frontend[[:space:]]\+".*"|set $active_frontend "'"$PREVIOUS_FE"'"|' nginx.conf
          sed -i 's|set[[:space:]]\+\$active_backend[[:space:]]\+".*"|set $active_backend "'"$PREVIOUS_BE"'"|' nginx.conf
          docker exec edge nginx -s reload
          echo "$ACTIVE_COLOR" > active_color.txt
          echo "Rollback vers $ACTIVE_COLOR effectué. Le déploiement a échoué."
          exit 1
        fi
        
        echo "Déploiement vers $TARGET_COLOR réussi."
        
        # --- Nettoyage ---
        echo "Arrêt et suppression de l'ancienne couleur ($ACTIVE_COLOR)..."
        docker compose -f docker-compose.${ACTIVE_COLOR}.yml --env-file .env.global down
        EOF

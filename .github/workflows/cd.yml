name: CD blue/green
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]           
jobs:
  Deploy:
    name: Déploiement blue/green 
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5
    - name: Préparer agent SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
    - name: Synchroniser fichiers de configuration
      run: |
        # Synchronisation uniquement des fichiers de configuration nécessaires
        rsync -avz --delete \
          --include='docker-compose.*.yml' \
          --include='nginx.conf' \
          --include='monitoring/' \
          --include='monitoring/**' \
          --include='conf.d/' \
          --include='conf.d/**' \
          --include='nginx-secure/' \
          --include='nginx-secure/**' \
          --exclude='.env.global' \
          --exclude='.my.cnf' \
          --exclude='my-exporter.cnf' \
          --exclude='active_color.txt' \
          --exclude='*' \
          -e "ssh -o StrictHostKeyChecking=no" \
          $GITHUB_WORKSPACE/ \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_DIR }}
    - name: Vérifier fichiers copiés
      run: ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls -l ${{ secrets.VPS_PROJECT_DIR }}"
    
    - name: Déployer couleur inactive, tester, basculer
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
        set -e
        cd ${{ secrets.VPS_PROJECT_DIR }}
        echo "Définition des variables ---"
        ACTIVE_COLOR=$(cat active_color.txt 2>/dev/null || echo "blue")
        if [ "$ACTIVE_COLOR" = "blue" ]; then
          TARGET_COLOR="green"
          TARGET_COMPOSE="docker-compose.green.yml"
          INACTIVE_FE="frontendGreen"
          INACTIVE_BE="backendGreen"
          PREVIOUS_FE="frontendBlue"
          PREVIOUS_BE="backendBlue"
          SERVICE_INACTIVE_FE="frontend-green"
          SERVICE_INACTIVE_BE="backend-green"
          SERVICE_ACTIVE_FE="frontend-blue"
          SERVICE_ACTIVE_BE="backend-blue"
        else
          TARGET_COLOR="blue"
          TARGET_COMPOSE="docker-compose.blue.yml"
          INACTIVE_FE="frontendBlue"
          INACTIVE_BE="backendBlue"
          PREVIOUS_FE="frontendGreen"
          PREVIOUS_BE="backendGreen"
          SERVICE_INACTIVE_FE="frontend-blue"
          SERVICE_INACTIVE_BE="backend-blue"
          SERVICE_ACTIVE_FE="frontend-green"
          SERVICE_ACTIVE_BE="backend-green"
        fi
        echo "Couleur active: $ACTIVE_COLOR ; Inactive à déployer: $TARGET_COLOR"
        echo "Démarrage des services statiques ---"
        docker compose -f docker-compose.db.yml --env-file .env.global up -d --no-recreate
        docker compose -f docker-compose.monitoring.yml up -d --no-recreate
        echo "Démarrage de la nouvelle couleur ---"
        docker compose -f $TARGET_COMPOSE --env-file .env.global pull
        docker compose -f $TARGET_COMPOSE --env-file .env.global up -d --wait
        docker compose -f docker-compose.edge.yml up -d --no-recreate
        # --- TESTS DE SANTÉ AVEC DOCKER EXEC ---
        echo "Tests santé avec docker exec..."
        # Installation curl dans edge
        docker exec edge sh -c "apk add --no-cache curl >/dev/null 2>&1 || true"
        echo "Test backend ($INACTIVE_BE):"
        docker exec $INACTIVE_BE curl -sSf http://localhost:8000/health/ || exit 1
        echo "Test frontend ($INACTIVE_FE):"
        docker exec $INACTIVE_FE curl -sSf http://cloalhost/ | head -n 1 || exit 1
        echo "Bascule: modification des fichiers upstream---"
        echo "server $SERVICE_INACTIVE_FE:80;" > conf.d/frontend_active.conf
        echo "server $SERVICE_INACTIVE_BE:8000;" > conf.d/backend_active.conf
        echo "Vérification des fichiers modifiés"
        cat conf.d/frontend_active.conf
        cat conf.d/backend_active.conf
        echo "Rechargement de Nginx ---"
        sleep 5
        docker exec edge nginx -t
        docker exec edge nginx -s reload
        echo "$TARGET_COLOR" > active_color.txt
        echo "Vérification post-bascule ---"
        MAX_RETRIES=6
        RETRY_COUNT=0
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -sSf -I https://ambohimahasoa-panne.duckdns.org | grep -q '200'; then
            break
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1 ))
          sleep 5
        done
        echo "tentative de roolback"
        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
          echo "server $SERVICE_ACTIVE_FE:80;" > conf.d/frontend_active.conf
          echo "server $SERVICE_ACTIVE_BE:8000;" > conf.d/backend_active.conf
          docker exec edge nginx -s reload
          echo "$ACTIVE_COLOR" > active_color.txt
          echo "Rollback vers $ACTIVE_COLOR effectué. Le déploiement a échoué."
          exit 1
        else
          echo "Toute est OK,roolback annulé"
        fi     
        echo "Déploiement vers $TARGET_COLOR réussi."
        echo "Nettoyage:Arrêt et suppression de l'ancienne couleur ($ACTIVE_COLOR)..."
        docker compose -f docker-compose.${ACTIVE_COLOR}.yml --env-file .env.global down
        EOF
    
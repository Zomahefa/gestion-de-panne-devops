name: Develop CI

on:
  push:
    branches: [ "develop" ]

jobs:
  lint:
    name: Lint Python & React
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer Ruff
      run: pip install ruff

    - name: Lint Python avec Ruff
      continue-on-error: true
      run: |
        cd backend
        ruff check .

    - name: Format Python avec Ruff
      continue-on-error: true
      run: |
        cd backend
        ruff check . --fix
        ruff format .

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.18.1
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installer les dépendances React
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Lint React avec ESLint
      run: |
        cd frontend
        npx eslint src --ext .js,.jsx,.ts,.tsx

  test:
    name: Tests Django & React + Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances Python
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Installer coverage.py
      run: pip install coverage

    - name: Tests Django avec coverage
      run: |
        cd backend
        coverage run manage.py test
        coverage report
        coverage html

    - name: Upload rapport coverage Django
      uses: actions/upload-artifact@v4
      with:
        name: django-coverage-report
        path: backend/htmlcov

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.18.1
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installer les dépendances React
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Tests React avec Vitest + coverage
      run: |
        cd frontend
        npx vitest run --coverage

    - name: Upload rapport coverage React
      uses: actions/upload-artifact@v4
      with:
        name: react-coverage-report
        path: frontend/coverage

  security:
    name: Analyse de sécurité (Semgrep + Trivy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer Semgrep
      run: pip install semgrep

    - name: Scan de sécurité avec Semgrep
      continue-on-error: true
      run: semgrep --config=auto

    - name: Scan Dockerfile backend
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './backend/Dockerfile'

    - name: Scan Dockerfile frontend
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './frontend/Dockerfile.dev'

    - name: Scan docker-compose.yml
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './docker-compose.yml'

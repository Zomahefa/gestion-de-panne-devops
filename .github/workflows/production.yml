name: Production CI/CD(blue/green)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]

jobs:
  Lint:
    name: Lint Python & React
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer Ruff
      run: pip install ruff

    - name: Lint Python avec Ruff
      run: |
        cd backend
        ruff check . --output-format=json > ruff-report.json
      
    - name: Upload Ruff report
      uses: actions/upload-artifact@v4
      with:
        name: ruff-report
        path: backend/ruff-report.json

    - name: Format Python avec Ruff
      run: |
        cd backend
        ruff check . --fix
        ruff format .

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.19.0
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installer les dépendances React
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Lint React avec ESLint
      run: |
        cd frontend
        npx eslint src --ext .js,.jsx,.ts,.tsx -f json -o eslint-report.json
    - name: Upload ESLint report
      uses: actions/upload-artifact@v4
      with:
        name: eslint-report
        path: frontend/eslint-report.json

  Test:
    name: Tests Django & React + Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances Python
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Installer coverage.py
      run: pip install coverage

    - name: Tests Django avec coverage
      run: |
        cd backend
        coverage run manage.py test --settings=backend.settings_ci
        coverage report
        coverage html

    - name: Upload rapport coverage Django
      uses: actions/upload-artifact@v4
      with:
        name: django-coverage-report
        path: backend/htmlcov

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.19.0
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installer les dépendances React
      run: |
        cd frontend
        npm install --legacy-peer-deps
    
    - name: Tests React avec Vitest + coverage
      run: |
        cd frontend
        npx vitest run --coverage

    - name: Upload rapport coverage React
      uses: actions/upload-artifact@v4
      with:
        name: react-coverage-report
        path: frontend/coverage

  Security:
    name: Analyse de sécurité (Semgrep + Trivy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.19.0
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Audit sécurité npm
      run: |
        cd frontend
        npm audit --audit-level=high || echo "Vulnérabilités connues, documentées dans SECURITY.md"
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Audit sécurité Python
      run: |
        pip install pip-audit
        pip-audit || echo "Vulnérabilités connues, documentées dans SECURITY.md"

    - name: Installer Semgrep
      run: pip install semgrep

    - name: Scan de sécurité avec Semgrep
      run: semgrep --config=auto --json > semgrep-report.json
    - name: Upload rapport Semgrep
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: semgrep-report.json

    - name: Scan Dockerfile backend
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './backend/Dockerfile'
    - name: Scan Dockerfile frontend
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './frontend/Dockerfile.dev'
    - name: Scan docker-compose.blue.yml
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './docker-compose.blue.yml'
    - name: Scan docker-compose.green.yml
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './docker-compose.green.yml'
    - name: Scan docker-compose.db.yml
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './docker-compose.db.yml'
    - name: Scan docker-compose.monitoring.yml
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './docker-compose.monitoring.yml'
    - name: Scan docker-compose.edge.yml
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './docker-compose.edge.yml'
  Dockerhub:
    name: Build & push des images vers dockerhub
    runs-on: ubuntu-latest
    needs: [Lint, Test, Security]
    if: success()
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/react-frontend-nginx-panne-staging:v${{ github.run_number }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/django-backend-panne-staging:v${{ github.run_number }}
  Deploy:
    name: Déploiement blue/green 
    runs-on: ubuntu-latest
    needs: [Dockerhub]   
    steps:
    - name: Préparer agent SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Synchroniser projet (exclure secrets)
      run: |
        rsync -az --delete \
          --exclude='.env.global' \
          --exclude='.my.cnf' \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_DIR }}/

    - name: Déployer couleur inactive, tester, basculer
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
        set -e
        cd ${{ secrets.VPS_PROJECT_DIR }}
        export $(grep -v '^#' .env.global | xargs)

        # Démarrer DB et monitoring (idempotent, ne plante pas si déjà up)
        docker compose -f docker-compose.db.yml up -d
        docker compose -f docker-compose.monitoring.yml up -d

        # Lire la couleur active depuis nginx.conf
        ACTIVE_BE=$(grep 'set \$active_backend' nginx.conf | sed 's/.*"\(.*\)".*/\1/')
        if [ "$ACTIVE_BE" = "backend-blue" ]; then
          INACTIVE_FE="frontend-green"
          INACTIVE_BE="backend-green"
          TARGET="green"
        else
          INACTIVE_FE="frontend-blue"
          INACTIVE_BE="backend-blue"
          TARGET="blue"
        fi
        echo "Couleur active: $ACTIVE_BE ; Inactive à déployer: $TARGET"

        # Démarrer uniquement la couleur inactive
        if [ "$TARGET" = "green" ]; then
          docker compose -f docker-compose.green.yml up -d
        else
          docker compose -f docker-compose.blue.yml up -d
        fi

        # Vérifier edge et Nginx
        docker compose -f docker-compose.edge.yml up -d
        docker compose -f docker-compose.edge.yml exec -T edge nginx -t

        # Installer curl dans edge si nécessaire
        docker compose -f docker-compose.edge.yml exec -T edge sh -c "apk add --no-cache curl >/dev/null 2>&1 || true"

        # Tests santé du backend inactif
        curl -sSf http://$INACTIVE_BE:8000/health | grep -q "ok"
        curl -sSf http://$INACTIVE_BE:8000/metrics | head -n 1 >/dev/null

        # Test frontend inactif
        curl -sSf http://$INACTIVE_FE:80/ | head -n 1 >/dev/null

        # Bascule: modifier nginx.conf et reload
        sed -i "s/set \\$active_frontend \".*\";/set \\$active_frontend \"$INACTIVE_FE\";/" nginx.conf
        sed -i "s/set \\$active_backend \".*\";/set \\$active_backend \"$INACTIVE_BE\";/" nginx.conf
        docker compose -f docker-compose.edge.yml up -d
        docker compose -f docker-compose.edge.yml exec -T edge nginx -t
        docker compose -f docker-compose.edge.yml exec -T edge nginx -s reload

        # Vérifier site public après bascule
        curl -sSf -I https://signaler-panne-305.duckdns.org | grep -q '200'
        curl -sSf https://signaler-panne-305.duckdns.org/metrics/ | head -n 1 >/dev/null
        curl -sSf https://signaler-panne-305.duckdns.org/ | head -n 1 >/dev/null

        # Surveiller 60s et rollback si problème
        sleep 60
        curl -sSf https://signaler-panne-305.duckdns.org/metrics/ | head -n 1 >/dev/null || {
          echo "Problème post-bascule; rollback vers l'autre couleur"
          if [ "$TARGET" = "green" ]; then
            sed -i "s/set \\$active_frontend \".*\";/set \\$active_frontend \"frontend-blue\";/" nginx.conf
            sed -i "s/set \\$active_backend \".*\";/set \\$active_backend \"backend-blue\";/" nginx.conf
          else
            sed -i "s/set \\$active_frontend \".*\";/set \\$active_frontend \"frontend-green\";/" nginx.conf
            sed -i "s/set \\$active_backend \".*\";/set \\$active_backend \"backend-green\";/" nginx.conf
          fi
          docker compose -f docker-compose.edge.yml up -d
          docker compose -f docker-compose.edge.yml exec -T edge nginx -t
          docker compose -f docker-compose.edge.yml exec -T edge nginx -s reload
          exit 1
        }

        echo "Bascule vers $TARGET réussie sans downtime."
        EOF

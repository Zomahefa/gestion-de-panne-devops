services:
  - type: web
    runtime: docker
    name: signaleo-api
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DJANGO_ENV
        value: prod
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "1"
      # Compte administrateur de reference. Passer BOOTSTRAP_ADMIN=1 le
      # temps d'un deploiement (avec ADMIN_PASSWORD) puis revenir a 0.
      - key: BOOTSTRAP_ADMIN
        value: "0"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: "0"
      # Page /admin-register (demonstration). Le code est obligatoire : sans
      # ADMIN_REGISTRATION_CODE, la page est fermee (aucun code par defaut
      # dans le depot).
      - key: ADMIN_REGISTRATION_ENABLED
        value: "1"
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      # Repertoire du cache partage par les workers (limitation de debit).
      - key: THROTTLE_CACHE_DIR
        value: "/tmp/signaleo-cache"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    runtime: static
    name: signaleo
    buildCommand: cd frontend && npm install --legacy-peer-deps && CI=false npm run build
    staticPublishPath: ./frontend/build
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20.19.0"

services:
  - type: web
    runtime: docker
    name: gestion-panne-api
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DJANGO_ENV
        value: prod
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    runtime: static
    name: gestion-panne-web
    buildCommand: cd frontend && npm install --legacy-peer-deps && CI=false npm run build
    staticPublishPath: ./frontend/build
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20.19.0"

global:
  scrape_interval: 15s  # Prometheus interroge les services toutes les 15 secondes

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']  # Prometheus se surveille lui-même

  - job_name: 'django-backend'
    metrics_path: /metrics/
    static_configs:
      - targets: ['backend:8000'] # backend est le nom du service Django dans Docker



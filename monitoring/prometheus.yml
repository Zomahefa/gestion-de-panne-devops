global:
  scrape_interval: 15s  # Prometheus interroge les services toutes les 15 secondes

scrape_configs:
  - job_name: 'django-backend'
    metrics_path: /metrics/
    scheme: https
    static_configs:
      - targets: ['signaler-panne-305.duckdns.org']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100'] 

  - job_name: 'mysql'
    scheme: https
    metrics_path: /mysql-metrics/
    static_configs:
      - targets: ['signaler-panne-305.duckdns.org']  
  

  
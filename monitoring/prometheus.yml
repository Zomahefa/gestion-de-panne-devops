global:
  scrape_interval: 15s  # Prometheus interroge les services toutes les 15 secondes

scrape_configs:
  - job_name: 'django-backend'
    metrics_path: /metrics/
    static_configs:
      - targets: ['edge:80']

  - job_name: 'node'
    static_configs:
      - targets: ['192.168.1.99:9100']  # exporter node sur la machine physique

  - job_name: 'mysql'
    metrics_path: /mysql-metrics
    static_configs:
      - targets: ['edge:80']  
  

  
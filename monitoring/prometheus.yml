global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'django-backend'
    metrics_path: /metrics/
    scheme: https
    static_configs:
      - targets: ['signaler-panne-305.duckdns.org']
    relabel_configs:
      - target_label: instance
        replacement: backend   # 🏷️ Remplace l'instance (qui serait le nom de domaine) par "backend"
      - target_label: color
        replacement: active 

  - job_name: 'mysql'
    metrics_path: /mysql-metrics/
    scheme: https
    static_configs:
      - targets: ['signaler-panne-305.duckdns.org']
    relabel_configs:
      - target_label: instance
        replacement: mysql
      - target_label: color
        replacement: active

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: instance
        replacement: serveur
      - target_label: color
        replacement: host

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: (frontendBlue|frontendGreen|backendBlue|backendGreen)
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: .*Blue
        target_label: color
        replacement: blue
      - source_labels: [__meta_docker_container_name]
        regex: .*Green
        target_label: color
        replacement: green
      - source_labels: [__meta_docker_container_name]
        regex: (frontend.*)
        target_label: job
        replacement: react-frontend
      - source_labels: [__meta_docker_container_name]
        regex: (backend.*)
        target_label: job
        replacement: django-backend
    pipeline_stages:
      - docker: {}

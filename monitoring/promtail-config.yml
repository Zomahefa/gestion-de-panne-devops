clients:
  - url: http://loki:3100/loki/api/v1/push

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: docker-all
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'docker'
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time

  - job_name: docker-dynamic
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_name]
        regex: .*Blue
        target_label: color
        replacement: blue
      - source_labels: [__meta_docker_container_name]
        regex: .*Green
        target_label: color
        replacement: green
      - source_labels: [__meta_docker_container_name]
        regex: edge
        target_label: service
        replacement: nginx
      - source_labels: [__meta_docker_container_name]
        regex: (frontend.*)
        target_label: service
        replacement: react-frontend
      - source_labels: [__meta_docker_container_name]
        regex: (backend.*)
        target_label: service
        replacement: django-backend
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/${1}/*.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
  - job_name: system-logs
    static_configs:
      - targets: ['localhost']
        labels:
          job: system
          __path__: /var/log/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>[^ ]+ [^ ]+ [^ ]+) (?P<host>[^ ]+) (?P<program>[^:]+): (?P<msg>.*)'
      - timestamp:
          source: time
          format: 'Jan 2 15:04:05'
          location: Local
      - labels:
          program:
      - output:
          source: msg

